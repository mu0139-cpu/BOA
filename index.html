<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1C1029">
<title>BOA 게임 참가</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #app { min-height: 100dvh; display: flex; flex-direction: column; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; text-align: center; padding: 16px 0; }
  .big { font-size: 64px; font-weight: 900; line-height: 1; }
  .title { font-size: 26px; font-weight: 700; }
  .field { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .field input { background: var(--panel); border: 1.5px solid var(--line); color: var(--text); border-radius: 12px; padding: 14px 16px; font-size: 20px; }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 360px; }
  .team-btn { border-radius: 14px; padding: 18px 8px; font-weight: 700; font-size: 18px; background: var(--panel); border: 2px solid transparent; }
  .team-btn.sel-purple { border-color: var(--purple); background: rgba(139,92,201,.25); }
  .team-btn.sel-gold { border-color: var(--gold); background: rgba(217,184,114,.2); }
  .err { color: var(--bad); min-height: 20px; font-size: 15px; }
  .tap-btn { width: min(78vw, 340px); aspect-ratio: 1; border-radius: 50%; font-size: 34px; font-weight: 900; color: #1C1029; touch-action: none; }
  .tap-btn:active { transform: scale(.96); }
  .grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(92vw, 420px); }
  .hole { aspect-ratio: 1; border-radius: 18px; background: var(--panel); border: 1.5px solid var(--line); font-size: 18px; font-weight: 900; touch-action: none; transition: background .05s; }
  .hole.mole { background: #8A5A3C; color: #fff; }
  .hole.gold { background: var(--gold); color: #1C1029; }
  .hole.bomb { background: #3A3A3A; color: var(--bad); border-color: var(--bad); }
  .hole.hit { outline: 3px solid #fff; }
  .react-pad { flex: 1; width: 100%; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; font-size: 32px; font-weight: 900; touch-action: none; }
  .choice-row { display: grid; gap: 12px; width: 100%; max-width: 420px; }
  .choice { padding: 26px 12px; border-radius: 16px; font-size: 24px; font-weight: 700; background: var(--panel); border: 2px solid var(--line); }
  .choice.on { border-color: var(--gold); background: rgba(217,184,114,.25); }
  .bar { width: 100%; max-width: 360px; height: 10px; background: var(--panel); border-radius: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--gold); }
</style>
</head>
<body>
<div id="app"><div class="stage"><p class="muted">불러오는 중…</p></div></div>
<script type="module" src="player.js"></script>
</body>
</html>
