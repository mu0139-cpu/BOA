<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOA 게임 진행</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { overflow: hidden; }
  #wrap { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; gap: 24px; padding: 18px 32px; border-bottom: 1px solid var(--line); }
  header .logo { font-size: 30px; font-weight: 700; }
  header .meta { color: var(--muted); font-size: 18px; }
  header .spacer { flex: 1; }
  main { overflow: auto; padding: 28px 40px; display: flex; flex-direction: column; }
  footer { display: flex; gap: 12px; justify-content: flex-end; align-items: center; padding: 16px 32px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  footer .hint { margin-right: auto; color: var(--muted); }
  .h-title { font-size: 56px; font-weight: 900; }
  .h-sub { font-size: 24px; color: var(--muted); }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; }
  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 48px; align-items: start; }
  .qr { background: #fff; padding: 18px; border-radius: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 10px 18px; border-radius: 999px; font-size: 22px; font-weight: 700; background: var(--panel-2); }
  .chip.purple { border: 2px solid var(--purple); }
  .chip.gold { border: 2px solid var(--gold); }
  .chip.out { opacity: .35; text-decoration: line-through; }
  .rows { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .row { display: grid; grid-template-columns: 56px 200px 1fr 140px; align-items: center; gap: 14px; font-size: 22px; }
  .row .rk { font-weight: 900; color: var(--gold); text-align: right; }
  .row .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .track { height: 26px; background: var(--panel); border-radius: 14px; overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 14px; transition: width .25s; }
  .clock { font-size: 120px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .podium { display: flex; gap: 24px; align-items: flex-end; justify-content: center; margin: 12px 0 28px; }
  .pod { width: 220px; text-align: center; }
  .pod .blk { border-radius: 14px 14px 0 0; background: var(--panel-2); border: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: center; padding-top: 14px; font-size: 40px; font-weight: 900; color: var(--gold); }
  .pod .nm { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; width: 100%; max-width: 1100px; }
  .opt { padding: 40px 24px; border-radius: 20px; background: var(--panel); border: 2px solid var(--line); font-size: 44px; font-weight: 900; }
  .opt.win { border-color: var(--good); background: rgba(124,214,164,.15); }
  .opt small { display: block; font-size: 26px; color: var(--muted); margin-top: 12px; }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; max-width: 900px; }
  textarea { width: 100%; min-height: 180px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font: inherit; font-size: 18px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(720px, 90vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 18px; }
  .mrow span { flex: 1; }
  .mrow button { padding: 6px 12px; min-height: 36px; font-size: 15px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="logo serif gold">BOA GAME NIGHT</span>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <button class="btn ghost" id="manage">참가자 관리</button>
  </header>
  <main id="stage"></main>
  <footer id="controls"></footer>
</div>
<dialog id="dlg">
  <h2 style="margin-bottom:12px">참가자 관리</h2>
  <p class="muted" style="margin-bottom:12px">폰을 바꿔야 하는 분은 ‘재입장 허용’을 누른 뒤 새 폰에서 같은 별명으로 입장하면 점수가 이어져요.</p>
  <div id="mlist"></div>
  <div style="display:flex;gap:12px;justify-content:space-between;margin-top:20px">
    <button class="btn danger" id="reset">전체 초기화</button>
    <button class="btn" id="close">닫기</button>
  </div>
</dialog>
<script type="module" src="host.js"></script>
</body>
</html>
