<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOA 게임 진행</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { overflow: hidden; }
  #wrap { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr) 300px; }
  #wrap > header, #wrap > footer { grid-column: 1 / -1; }
  #wrap > main { grid-column: 1; grid-row: 2; min-height: 0; }
  #glist { grid-column: 2; grid-row: 2;min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: rgba(42, 26, 61, .55); padding: 20px 16px; display: flex; flex-direction: column; gap: 8px; }
  #glist .gl-head { font-size: 14px; letter-spacing: .2em; color: var(--gold); margin: 0 6px 6px; }
  #glist .gl-item { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 12px; border-radius: 12px; background: transparent; border: 1.5px solid transparent; color: var(--text); font-size: 19px; font-weight: 700; }
  #glist .gl-item:hover { background: var(--panel-2); }
  #glist .gl-no { font-family: "Cormorant Garamond", serif; font-size: 24px; color: var(--gold); text-align: center; }
  #glist .gl-tag { font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  #glist .gl-item.now { border-color: var(--gold); background: rgba(217, 184, 114, .16); }
  #glist .gl-item.now .gl-tag { background: var(--gold); color: #1C1029; }
  #glist .gl-item.done { color: var(--muted); }
  #glist .gl-item.done .gl-tag { color: var(--good); border: 1px solid var(--good); }
  #glist .gl-tag:empty { display: none; }
  #glist .gl-sep { height: 1px; background: var(--line); margin: 8px 6px; }
  #glist .gl-item.extra .gl-no { font-family: inherit; font-size: 20px; }
  header .snd { min-width: 52px; padding: 10px 14px; font-size: 20px; }
  header .snd.off { opacity: .45; }
  .final-wrap { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 40px; align-items: center; flex: 1; }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 44px 130px 1fr 70px; align-items: center; gap: 12px; font-size: 20px; }
  .bar-row .rk { font-weight: 900; color: var(--gold); text-align: right; }
  .bar-row .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .val { font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
  .bar-track { height: 26px; border-radius: 8px; background: var(--panel); overflow: hidden; display: flex; }
  .bar-track > i { display: block; height: 100%; width: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .bar-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 15px; color: var(--muted); }
  .bar-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .bar-legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .podium.medal .pod .blk { font-size: 44px; }
  .podium.medal .pod:nth-child(2) .blk { background: linear-gradient(180deg, rgba(217,184,114,.55), rgba(217,184,114,.15)); color: #1C1029; }
  .podium.medal .pod:nth-child(1) .blk { background: linear-gradient(180deg, rgba(199,199,214,.45), rgba(199,199,214,.1)); }
  .podium.medal .pod:nth-child(3) .blk { background: linear-gradient(180deg, rgba(205,127,70,.5), rgba(205,127,70,.12)); }
  header { display: flex; align-items: center; gap: 24px; padding: 18px 32px; border-bottom: 1px solid var(--line); }
  header .logo { font-size: 30px; font-weight: 700; }
  header .meta { color: var(--muted); font-size: 18px; }
  header .spacer { flex: 1; }
  main { overflow: auto; padding: 28px 40px; display: flex; flex-direction: column; }
  footer { display: flex; gap: 12px; justify-content: flex-end; align-items: center; padding: 16px 32px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  footer .hint { margin-right: auto; color: var(--muted); }
  .h-title { font-size: 56px; font-weight: 900; }
  .h-sub { font-size: 24px; color: var(--muted); }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; }
  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 48px; align-items: start; }
  .qr { background: #fff; padding: 18px; border-radius: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 10px 18px; border-radius: 999px; font-size: 22px; font-weight: 700; background: var(--panel-2); }
  .chip.purple { border: 2px solid var(--purple); }
  .chip.gold { border: 2px solid var(--gold); }
  .chip.out { opacity: .35; text-decoration: line-through; }
  .rows { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .row { display: grid; grid-template-columns: 56px 200px 1fr 140px; align-items: center; gap: 14px; font-size: 22px; }
  .row .rk { font-weight: 900; color: var(--gold); text-align: right; }
  .row .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .track { height: 26px; background: var(--panel); border-radius: 14px; overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 14px; transition: width .25s; }
  .clock { font-size: 120px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .podium { display: flex; gap: 24px; align-items: flex-end; justify-content: center; margin: 12px 0 28px; }
  .pod { width: 220px; text-align: center; }
  .pod .blk { border-radius: 14px 14px 0 0; background: var(--panel-2); border: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: center; padding-top: 14px; font-size: 40px; font-weight: 900; color: var(--gold); }
  .pod .nm { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; width: 100%; max-width: 1100px; }
  .opt { padding: 40px 24px; border-radius: 20px; background: var(--panel); border: 2px solid var(--line); font-size: 44px; font-weight: 900; }
  .opt.win { border-color: var(--good); background: rgba(124,214,164,.15); }
  .opt small { display: block; font-size: 26px; color: var(--muted); margin-top: 12px; }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; max-width: 900px; }
  textarea { width: 100%; min-height: 180px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font: inherit; font-size: 18px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(720px, 90vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 18px; }
  .mrow span { flex: 1; }
  .mrow button { padding: 6px 12px; min-height: 36px; font-size: 15px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="logo serif gold" id="logo">BOA GAME NIGHT</span>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <button class="btn ghost snd" id="bgm-btn" title="배경음 켜기/끄기" aria-label="배경음 켜기/끄기">🎵</button>
    <button class="btn ghost snd" id="sfx-btn" title="효과음 켜기/끄기" aria-label="효과음 켜기/끄기">🔊</button>
    <button class="btn ghost" id="edit-title">타이틀 변경</button>
    <button class="btn ghost" id="manage">참가자 관리</button>
  </header>
  <main id="stage"></main>
  <nav id="glist" aria-label="게임 목록"></nav>
  <footer id="controls"></footer>
</div>
<dialog id="dlg">
  <h2 style="margin-bottom:12px">게임 타이틀</h2>
  <div style="display:flex;gap:10px;margin-bottom:24px">
    <input id="title-in" maxlength="30" placeholder="비우면 기본 타이틀" style="flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:18px">
    <button class="btn" id="save-title">타이틀 저장</button>
  </div>
  <h2 style="margin-bottom:12px">참가자 관리</h2>
  <p class="muted" style="margin-bottom:12px">폰을 바꿔야 하는 분은 ‘재입장 허용’을 누른 뒤 새 폰에서 같은 별명으로 입장하면 점수가 이어져요.</p>
  <div id="mlist"></div>
  <div style="display:flex;gap:12px;justify-content:space-between;margin-top:20px">
    <button class="btn danger" id="reset">전체 초기화</button>
    <button class="btn" id="close">닫기</button>
  </div>
</dialog>
<script type="module" src="host.js"></script>
</body>
</html>
